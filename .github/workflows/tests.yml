name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          node --check cardmarket-core.js
          node --check cardmarket-repricer.js
          node --check cardmarket-stockfiller.js
